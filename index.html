<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐릭터 플레이리스트 만들기</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <!-- 상단 설정 바 -->
    <div class="toolbar">
        <div class="color-picker">
            <label for="bgColorPicker">배경색</label>
            <input type="color" id="bgColorPicker" value="#f8f9fa">
        </div>
        <div class="color-picker">
            <label for="textColorPicker">글자색</label>
            <input type="color" id="textColorPicker" value="#343a40">
        </div>
        <button onclick="saveAsImage()" class="save-btn" id="saveBtn">이미지로 저장 📸</button>
    </div>

    <!-- 캡처되는 메인 영역 -->
    <div id="capture-area">
        <!-- 페어 이름 -->
        <div class="pair-name-container">
            <div class="pair-name-box">
                <input type="text" id="pairNameInput" class="pair-name-input" placeholder="페어 이름을 입력하세요" oninput="saveDataToStorage()">
            </div>
        </div>

        <div class="main-container">
            <!-- 캐릭터 1 (왼쪽) -->
            <div class="character-section" id="char1-section">
                <!-- 포토 프레임 (드래그 및 업로드) -->
                <div class="photo-frame" id="frame-char1" onmousedown="startDrag(event, 1)" ontouchstart="startDrag(event, 1)">
                    <div class="photo-placeholder" id="placeholder-char1">클릭하여<br>사진 업로드</div>
                    <img id="img-char1" src="" alt="캐릭터 1 사진" data-x="0" data-y="0" data-scale="1">
                    <input type="file" id="file-char1" accept="image/*" style="display: none;" onchange="handleImageUpload(event, 1)">
                </div>

                <!-- 사진 조절 및 변경 툴바 -->
                <div class="photo-control-container" id="control-container-1" style="display: none;">
                    <div class="photo-control">
                        <span>🔍 크기</span>
                        <input type="range" min="0.5" max="3" step="0.05" value="1" oninput="zoomImage(event, 1)">
                    </div>
                    <button type="button" class="change-photo-btn" onclick="triggerFileInput(1)">사진 변경</button>
                </div>
                
                <input type="text" id="charName1" class="char-name-input" placeholder="캐릭터 1 이름" oninput="saveDataToStorage()">
                <textarea id="quote1" class="quote-input" placeholder="캐릭터 1의 한 마디" rows="1" oninput="autoResize(this); saveDataToStorage()"></textarea>
                
                <div class="playlist-container">
                    <div class="search-box">
                        <input type="text" id="search1" placeholder="유튜브 링크(URL)를 입력하세요" onkeypress="if(event.key==='Enter') addSongByYouTubeLink(1)">
                        <button onclick="addSongByYouTubeLink(1)">추가</button>
                    </div>
                    <div class="search-guide">💡 유튜브 영상 링크를 넣으면 썸네일이 자동으로 등록됩니다! (최대 6곡)</div>
                    <div id="playlist1" class="my-playlist"></div>
                </div>
            </div>

            <!-- 캐릭터 2 (오른쪽) -->
            <div class="character-section" id="char2-section">
                <!-- 포토 프레임 (드래그 및 업로드) -->
                <div class="photo-frame" id="frame-char2" onmousedown="startDrag(event, 2)" ontouchstart="startDrag(event, 2)">
                    <div class="photo-placeholder" id="placeholder-char2">클릭하여<br>사진 업로드</div>
                    <img id="img-char2" src="" alt="캐릭터 2 사진" data-x="0" data-y="0" data-scale="1">
                    <input type="file" id="file-char2" accept="image/*" style="display: none;" onchange="handleImageUpload(event, 2)">
                </div>

                <!-- 사진 조절 및 변경 툴바 -->
                <div class="photo-control-container" id="control-container-2" style="display: none;">
                    <div class="photo-control">
                        <span>🔍 크기</span>
                        <input type="range" min="0.5" max="3" step="0.05" value="1" oninput="zoomImage(event, 2)">
                    </div>
                    <button type="button" class="change-photo-btn" onclick="triggerFileInput(2)">사진 변경</button>
                </div>

                <input type="text" id="charName2" class="char-name-input" placeholder="캐릭터 2 이름" oninput="saveDataToStorage()">
                <textarea id="quote2" class="quote-input" placeholder="캐릭터 2의 한 마디" rows="1" oninput="autoResize(this); saveDataToStorage()"></textarea>
                
                <div class="playlist-container">
                    <div class="search-box">
                        <input type="text" id="search2" placeholder="유튜브 링크(URL)를 입력하세요" onkeypress="if(event.key==='Enter') addSongByYouTubeLink(2)">
                        <button onclick="addSongByYouTubeLink(2)">추가</button>
                    </div>
                    <div class="search-guide">💡 유튜브 영상 링크를 넣으면 썸네일이 자동으로 등록됩니다! (최대 6곡)</div>
                    <div id="playlist2" class="my-playlist"></div>
                </div>
            </div>
        </div>

        <!-- 워터마크 -->
        <div class="watermark">이요 @lies_are_white</div>
    </div>

    <!-- html2canvas 라이브러리 -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
